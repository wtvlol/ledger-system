server.address=127.0.0.1
server.port=8080
spring.application.name=ledger-system
spring.jackson.read.strict-duplicate-detection=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.lifecycle.timeout-per-shutdown-phase=20s
server.shutdown=graceful
ledger.database=data/ledger.db
ledger.opening-at=2026-01-01T00:00:00Z
ledger.queue-capacity=100
ledger.max-waiters=200
ledger.response-timeout=30s
ledger.shutdown-timeout=10s
ledger.busy-timeout-ms=5000
ledger.page-size=50
ledger.max-page-size=200
ledger.max-input-length=64
ledger.max-amount-precision=19
ledger.max-rate-precision=18
ledger.max-rate-scale=12
ledger.fx.rounding-policy=HALF_EVEN
