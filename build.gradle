plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.example'
version = '0.1.0'
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.xerial:sqlite-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs.add('-parameters')
}
checkstyle { toolVersion = '14.1.0' }
tasks.named('bootRun') { jvmArgs '--enable-native-access=ALL-UNNAMED' }
tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxParallelForks = 1
    systemProperty 'ledger.test.classpath', sourceSets.test.runtimeClasspath.asPath
    testLogging { events 'failed', 'skipped' }
}

// JavaScript tools are build-time checks; the frontend uses native browser modules.
tasks.register('installJavaScriptTools', Exec) {
    inputs.files('package.json', 'package-lock.json')
    outputs.dir('node_modules')
    commandLine 'npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'
}
tasks.register('checkJavaScript', Exec) {
    dependsOn 'installJavaScriptTools'
    inputs.files(fileTree('src/main/resources/static') { include '*.js' },
            fileTree('src/test/js') { include '*.js' }, 'eslint.config.js')
    commandLine 'npm', 'run', 'check'
}
tasks.named('check') { dependsOn 'checkJavaScript' }
